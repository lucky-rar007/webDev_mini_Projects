<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylized Blog Post Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="blog-post-card">
    <img src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" 
         alt="Blog post cover" 
         class="post-img">
    <div class="post-content">
      <h2 class="post-title">Exploring the Beauty of Nature</h2>
      <p class="post-excerpt">
        Nature offers a peaceful retreat from the chaos of daily life. Discover how immersing yourself in natural surroundings can refresh your mind and soul.
      </p>
      <a href="#" class="read-more">Read More</a>
    </div>
  </div>
</body>
</html>
