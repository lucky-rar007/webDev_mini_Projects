<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Feature Selection</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Feature Selection</h1>

    <div class="feature-card-container">
      <label class="feature-card">
        <input type="checkbox" />
        <div class="feature-text">
          <span class="feature-title">Feature One</span>
          <span class="feature-description"
            >Enable dark mode for a comfortable viewing experience at
            night.</span
          >
        </div>
      </label>

      <label class="feature-card">
        <input type="checkbox" />
        <div class="feature-text">
          <span class="feature-title">Feature Two</span>
          <span class="feature-description"
            >Receive instant email alerts for important updates and
            messages.</span
          >
        </div>
      </label>

      <label class="feature-card">
        <input type="checkbox" />
        <div class="feature-text">
          <span class="feature-title">Feature Three</span>
          <span class="feature-description"
            >Automatically back up your data to keep everything safe and
            secure.</span
          >
        </div>
      </label>
    </div>
  </body>
</html>
