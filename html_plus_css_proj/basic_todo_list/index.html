<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylized To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>My To-Do List</h1>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="task1">
            <label for="task1">Morning Routine</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.example.com" target="_blank">Check Emails</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="task2">
            <label for="task2">Work Tasks</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.example.com" target="_blank">Complete Report</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="task3">
            <label for="task3">Exercise</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.example.com" target="_blank">Go for a Run</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="task4">
            <label for="task4">Evening Routine</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.example.com" target="_blank">Read a Book</a></li>
            </ul>
        </li>
    </ul>
</body>
</html>
