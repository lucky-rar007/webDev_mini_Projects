<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="business-card">
      <img
        class="profile-image"
        src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg"
        alt="Decorative flower profile image"
      />

      <p class="full-name">lucky</p>
      <p class="designation">Front-End Developer</p>
      <p class="company">Creative Web Studio</p>

      <hr />

      <p>laksh@exe.com</p>
      <p>+0000000000</p>

      <a class="portfolio-link" href="https://www.freecodecamp.org">
        Portfolio
      </a>

      <hr />

      <div class="social-media">
        <h2>Connect with me</h2>
        <a href="https://twitter.com">Twitter</a>
        <a href="https://www.linkedin.com">LinkedIn</a>
        <a href="https://github.com">GitHub</a>
      </div>
    </div>
  </body>
</html>
